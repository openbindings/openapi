[package]
name = "openbindings-openapi"
description = "Optional OpenAPI kind adapter for OpenBindings"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openbindings = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "ca4c63a624d0a4310c0df015824206d7e975960a" }
openbindings-source-inspection = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "ca4c63a624d0a4310c0df015824206d7e975960a" }
openbindings-interface-synthesis = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "ca4c63a624d0a4310c0df015824206d7e975960a" }
openbindings-invocation = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "ca4c63a624d0a4310c0df015824206d7e975960a" }
dynamic-openapi-client = { git = "https://github.com/openbindings/openapi-client", rev = "fbcb868ea31a34fd4fd566244b7e40857f7df771", version = "=0.0.0" }
serde_json_compat = { package = "serde_json", version = "1.0.151", features = ["raw_value"] }
fluent-uri = "0.4.1"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "net", "io-util"] }
dynamic-openapi-client-reqwest = { git = "https://github.com/openbindings/openapi-client", rev = "fbcb868ea31a34fd4fd566244b7e40857f7df771", version = "=0.0.0" }
openbindings-json-schema-evaluator = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "ca4c63a624d0a4310c0df015824206d7e975960a" }
