[package]
name = "openapi-inspection-consumer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]
[features]
wasm-probe = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
[dependencies]
openbindings = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "f79cc70964ced113030dcb7051b4da0d838fb0c7" }
openbindings-source-inspection = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "f79cc70964ced113030dcb7051b4da0d838fb0c7" }
openbindings-openapi = { version = "=0.2.0-alpha.1", path = "../../crates/openbindings-openapi" }
dynamic-openapi-client = { git = "https://github.com/openbindings/openapi-client", rev = "fbcb868ea31a34fd4fd566244b7e40857f7df771", version = "=0.0.0", features = ["qualification"] }
# Qualification counters only; consumer behavior uses public SDK APIs exclusively.
openbindings-internal-json = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "f79cc70964ced113030dcb7051b4da0d838fb0c7" }
serde_json = "1.0.151"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }

[[example]]
name = "inspection-measure"
path = "examples/measure.rs"
