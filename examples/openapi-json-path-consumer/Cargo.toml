[package]
name = "openapi-json-path-consumer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]
[features]
wasm-probe = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
[dependencies]
openbindings = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "688dbc5c363ee632c6ca1c7f7b814942b5c367db" }
openbindings-source-inspection = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "688dbc5c363ee632c6ca1c7f7b814942b5c367db" }
openbindings-interface-synthesis = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "688dbc5c363ee632c6ca1c7f7b814942b5c367db" }
openbindings-invocation = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "688dbc5c363ee632c6ca1c7f7b814942b5c367db" }
openbindings-json-schema-evaluator = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "688dbc5c363ee632c6ca1c7f7b814942b5c367db" }
openbindings-openapi = { version = "=0.2.0-alpha.1", path = "../../crates/openbindings-openapi" }
dynamic-openapi-client = { git = "https://github.com/openbindings/openapi-client", rev = "fbcb868ea31a34fd4fd566244b7e40857f7df771", version = "=0.0.0", features = ["qualification"] }
# Test instrumentation only; the consumer API uses the public packages above.
openbindings-internal-json = { version = "=0.2.0-alpha.1", git = "https://github.com/openbindings/sdk", rev = "688dbc5c363ee632c6ca1c7f7b814942b5c367db" }
serde_json = "1.0.151"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
js-sys = { version = "=0.3.106", optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros", "time"] }
