name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - run: cargo fetch --locked
      - run: npm ci --ignore-scripts
      - run: python tools/attribution.py --check
      - run: cargo build --locked --offline
      - run: cargo test --locked --offline
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --offline --workspace --lib --tests -- -D warnings
      - run: python tools/verify-openapi-inspection.py
      - run: python tools/verify-openapi-json-path.py
      - run: python tools/verify-openapi-invocation-only.py

  archives-and-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openbindings/sdk
          ref: f79cc70964ced113030dcb7051b4da0d838fb0c7
          path: target/sdk-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.99.0'
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path target/sdk-source/Cargo.toml
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci --ignore-scripts
      - run: python tools/attribution.py --check
      - run: python tools/verify-openapi-json-path.py --archives --wasm --sdk-source target/sdk-source
      - run: python tools/verify-openapi-inspection.py --archives --wasm --sdk-source target/sdk-source
      - run: python tools/verify-openapi-invocation-only.py --archives

  ci:
    if: always()
    needs: [native, archives-and-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not results or any(result != 'success' for result in results):
              raise SystemExit('Required job results: ' + repr(results))
          PY
